<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yangi parol — CyberAI Pro</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#03070d;color:#e7f0ff;font:16px system-ui,sans-serif}main{width:min(92vw,440px);padding:30px;border:1px solid #17376b;border-radius:18px;background:#050c18}h1{color:#5596ff;font-size:1.5rem}p{color:#b6bdc9;line-height:1.5}label{display:block;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #283c5b;background:#03070d;color:white;font:inherit}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:9px;background:#2468d6;color:#030811;font-weight:700;font:inherit;cursor:pointer}a{color:#67a1ff}.message{padding:10px;border-radius:8px;background:#0a172d;margin:10px 0}</style><link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=2) }}"></head>
<body><main><h1>Yangi parol o‘rnating</h1><p>Telegramdan olgan 6 xonali kodni kiriting. Kod 10 daqiqa amal qiladi.</p>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="message" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Foydalanuvchi nomi</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" required><label for="code">Telegram kodi</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required><label for="password">Yangi parol</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm_password">Parolni takrorlang</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Parolni yangilash</button></form>
<p><a href="{{ url_for('forgot_password') }}">Yangi kod so‘rash</a></p><p><a href="{{ url_for('auth_page') }}">Kirish oynasiga qaytish</a></p></main></body></html>
